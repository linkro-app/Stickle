# Install once per clone: uv run pre-commit install
repos:
  - repo: local
    hooks:
      - id: block-private-paths
        name: block private paths
        entry: uv run --locked python scripts/check_private_paths.py
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-check
        name: ruff check
        entry: uv run --locked ruff check
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format --check
        language: system
        types_or: [python, pyi]
      - id: pyright
        name: pyright
        entry: uv run --locked pyright
        language: system
        pass_filenames: false
        types_or: [python, pyi]
      # CI checks types on Linux and macOS too: code for one system must not
      # fail there (the two do not read every check alike).
      - id: pyright-linux
        name: pyright (as on Linux)
        entry: uv run --locked pyright --pythonplatform Linux
        language: system
        pass_filenames: false
        types_or: [python, pyi]
      - id: pyright-macos
        name: pyright (as on macOS)
        entry: uv run --locked pyright --pythonplatform Darwin
        language: system
        pass_filenames: false
        types_or: [python, pyi]
      - id: pytest
        name: pytest
        entry: uv run --locked pytest -q
        language: system
        pass_filenames: false
        always_run: true
